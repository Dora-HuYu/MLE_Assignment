services:
  jupyter:
    build: 
      context: .
      dockerfile: Dockerfile_jupyter.txt
    image: mle-assignment-jupyter
    container_name: MLE_Aissgnemnt2
    ports:
      - "8885:8888"
    volumes:
      # Mount the current directory (project root) to /app in container
      - .:/app
      # Mount git config for seamless git operations
      - ~/.gitconfig:/root/.gitconfig:ro
      # Mount SSH keys for private repo access (optional)
      - ~/.ssh:/root/.ssh:ro
      # Ensure git credentials are available
      - ~/.git-credentials:/root/.git-credentials:ro
    environment:
      - JUPYTER_ENABLE_LAB=yes
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--allow-root", "--notebook-dir=/app", "--ServerApp.token=''", "--ServerApp.disable_check_xsrf=True"]

    #Airflow Service
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile_airflow.txt
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__FERNET_KEY=PAqBeGJLJTYFzVkOGHWIYXdLO7XdXz5yTdxAGJe9ezM=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - airflow_data:/opt/airflow
      - ./airflow_jobs:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./datamart:/opt/airflow/datamart
      - ./configs:/opt/airflow/configs 
      - ./models:/opt/airflow/models
      - ./src/utils:/opt/airflow/dags/utils
      - ./outputs:/opt/airflow/outputs
      - ./model_bank:/opt/airflow/model_bank

      

    entrypoint: >
      /bin/bash -c "airflow db init &&
      airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true"

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile_airflow.txt
    depends_on:
      - airflow-init
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__FERNET_KEY=PAqBeGJLJTYFzVkOGHWIYXdLO7XdXz5yTdxAGJe9ezM=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - airflow_data:/opt/airflow
      - ./airflow_jobs:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./datamart:/opt/airflow/datamart
      - ./configs:/opt/airflow/configs
      - ./models:/opt/airflow/models
      - ./outputs:/opt/airflow/outputs
      - ./src/utils:/opt/airflow/dags/utils
      - ./model_bank:/opt/airflow/model_bank

    ports:
      - "8091:8080"
    command: webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile_airflow.txt
    depends_on:
      - airflow-init
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__FERNET_KEY=PAqBeGJLJTYFzVkOGHWIYXdLO7XdXz5yTdxAGJe9ezM=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - airflow_data:/opt/airflow
      - ./airflow_jobs:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./datamart:/opt/airflow/datamart
      - ./configs:/opt/airflow/configs
      - ./models:/opt/airflow/models
      - ./outputs:/opt/airflow/outputs
      - ./src/utils:/opt/airflow/dags/utils
      - ./model_bank:/opt/airflow/model_bank
      - /var/run/docker.sock:/var/run/docker.sock
    command: scheduler
  
  inference1:
    build:
      context: .
      dockerfile: Dockerfile_inference.txt
    container_name: inference1
    volumes:
      - ./datamart:/opt/airflow/datamart
      - ./src:/opt/airflow/src
      - ./outputs:/opt/airflow/outputs
      - ./models:/opt/airflow/models
      - ./configs:/opt/airflow/configs
      - ./data:/opt/airflow/data
      - ./src/utils:/opt/airflow/dags/utils
      - ./model_bank:/opt/airflow/model_bank
    command: ["sleep", "infinity"]
volumes:
  airflow_data: